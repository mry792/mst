[project]
name = "mst"
version = "0.0.1"
description = ""
authors = [
    {name = "M. Emery Goss", email = "m.goss792@gmail.com"}
]
requires-python = ">=3.12,<3.13"

[tool.poetry.group.dev.dependencies]
pyright = "^1.1.399"
pytest = "^8.3.5"
pytest-asyncio = "^0.26.0"
pytest-ruff = "^0.4.1"
ruff = "^0.9.10"

[tool.poetry.dependencies]
anyio = "^4.9.0"
pygit2 = "^1.17.0"

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
pythonpath = ["src"]

[tool.pyright]
# # https://github.com/microsoft/pyright/blob/main/docs/configuration.md
# useLibraryCodeForTypes = true
exclude = ["*"]

[tool.ruff]
target-version = "py312"
src = ["src"]
line-length = 80
exclude = [
    "src/__pycache__",
    ".*cache",
    ".pythonlibs",
    "desired.py",
]
# https://beta.ruff.rs/docs/configuration/

[tool.ruff.format]
docstring-code-format = true
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # Pyflakes
    "C90",     # mccabe
    "I",       # isort
    "N",       # pep8-naming
    "D",       # pydocstyle
    "UP",      # pyupgrade
    "YTT",     # flake8-2020
    # "ANN",     # flake8-annotations
    "ASYNC",   # flake8-async
    "FBT",     # flake8-boolean-trap
    "B",       # flake8-bugbear
    "A",       # flake8-builtins
    "COM",     # flake8-commas
    "C4",      # flake8-comprehensions
    "DTZ",     # flake8-datetimez
    "T10",     # flake8-debugger
    "EXE",     # flake8-executable
    "FA",      # flake8-future-annotations
    "ISC",     # flake8-implicit-str-concat
    "LOG",     # flake8-logging
    "G",       # flake8-logging-format
    "PIE",     # flake8-pie
    "T20",     # flake8-print
    "PYI",     # flake8-pyi
    "PT",      # flake8-pytest-style
    "Q",       # flake8-quotes
    "RET",     # flake8-return
    "SLF",     # flake8-self
    "SLOT",    # flake8-slots
    "SIM",     # flake8-simplify
    "TID252",  # flake8-tidy-imports -- relative-imports
    "TCH",     # flake8-type-checking
    "ARG",     # flake8-unused-arguments
    "PTH",     # flake8-use-pathlib
    "PGH",     # pygrep-hooks
    "PL",      # pylint
    "TRY",     # tryceratops
    "FLY",     # flynt
    "PERF",    # Perflint
    "FURB",    # refurb
    "RUF",     # Ruff-specific rules
]
ignore = [
    # Groups not enabled:
    "DJ",      # flake8-django
    "EM",      # flake8-errmsg
    "ICN",     # flake8-import-convention
    "INP",     # flake8-no-pep420
    "RSE",     # flake8-raise
    "TID",     # flake8-tidy-imports
    "INT",     # flake8-gettext
    "NPY",     # NumPy
    "AIR",     # Airflow

    # Specific checks not enabled:
    "D202",    # no-blank-line-after-function
    "D203",    # one-blank-line-before-class
    "D212",    # multi-line-summary-first-line
    "W291",
    "W292",
    "W293",
    "G003",    # logging-string-concat
    "G004",    # logging-f-string
    "SIM107",  # return-in-try-except-finally (maybe enable this)
]

[tool.ruff.lint.per-file-ignores]
"tests/**.py" = [
    "D",       # pydocstyle
]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
